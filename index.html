<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOT SWILL</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#bbb;
    font-family:"Courier New",Courier,monospace;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px}
  canvas{background:#000;border:2px solid #333;max-width:98vw;max-height:80vh;
    image-rendering:pixelated}
  #hint{font-size:12px;color:#777;text-align:center;line-height:1.6;max-width:680px}
  b{color:#fff}
</style>
</head>
<body>
<canvas id="game" width="640" height="416"></canvas>
<div id="hint">
  <b>Q</b> up &nbsp; <b>A</b> down &nbsp;|&nbsp;
  <b>I</b> fire up &nbsp; <b>O</b> fire to the side &nbsp; <b>P</b> fire down &nbsp;|&nbsp;
  <b>SPACE</b> draw / continue &nbsp; <b>M</b> mute
</div>
<script>
(() => {
"use strict";

const CELL = 16, COLS = 40, ROWS = 26;
const W = COLS * CELL, H = ROWS * CELL;
const HORIZON = 7;
const INK = "#ffffff", DIM = "#b4b4b4", FAINT = "#555555", GROUND = "#2a2a2a";

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
ctx.textBaseline = "top";
ctx.font = "bold " + (CELL - 3) + "px 'Courier New',Courier,monospace";

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

const COW_L = [" o ", "<|-", "/ \\"];
const COW_R = [" o ", "-|>", "/ \\"];
const CACTUS = [" | ", "-| ", " | "];
const WAGON = [" ___ ", "[___]", "O   O"];
const SUN = [" \\|/ ", "--O--", " /|\\ "];
const CLOUD = ["  .--.  ", " (    ) ", "  `--'  "];

const SEMI = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11 };
function freq(name) {
  const m = name.match(/^([A-G][#b]?)(-?\d)$/);
  return 440 * Math.pow(2, ((parseInt(m[2], 10) + 1) * 12 + SEMI[m[1]] - 69) / 12);
}

const HOME_MEL = [
  "D5", "D5", "C5", "C5", "B4", "A4", "B4", "B4", "B4", "B4",
  "D4", "D4", "G4", "G4", "G4", "G4", "F#4", "G4", "A4", "A4", "A4", "A4",
  "D4", "D4", "G4", "G4", "A4", "B4", "B4", "B4",
  "G4", "F#4", "E4", "C5", "C5", "C5", "C5", "C5", "C5",
  "C5", "C5", "B4", "A4", "G4", "G4", "F#4", "G4", "A4", "G4", "G4", "G4", "G4"
];

const FUNERAL_MEL = [
  "D3", "D3", "D3", "D3", "F3", "E3", "E3", "D3", "D3", "C#3", "D3", "D3",
  "A3", "G3", "F3", "E3", "E3", "A3", "G3", "F3", "E3", "E3"
];

const sfx = {
  ctx: null, muted: false, step: 0,
  boot() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(f, dur, type, gain, to, when) {
    if (this.muted || !this.ctx) return;
    const t = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(gain || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, gain) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = buf; g.gain.value = gain || 0.15;
    s.connect(g); g.connect(this.ctx.destination); s.start(t);
  },
  shoot()      { this.tone(880, 0.07, "square", 0.05, 200); },
  enemyShoot() { this.tone(440, 0.08, "square", 0.045, 140); },
  wall()       { this.tone(300, 0.04, "square", 0.05, 180); },
  reload()     { this.tone(160, 0.05, "square", 0.05, 420); },
  hit()        { this.noise(0.16, 0.16); this.tone(110, 0.22, "sawtooth", 0.07, 55); },
  win()  { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.14, "square", 0.06), i * 100)); },
  funeral() {
    if (this.muted || !this.ctx) return;
    let t = this.ctx.currentTime + 0.05;
    for (const n of FUNERAL_MEL) {
      this.tone(freq(n), 0.4, "square", 0.07, null, t);
      t += 0.44;
    }
  },
  music() {
    if (this.muted || !this.ctx) return;
    const n = HOME_MEL[this.step % HOME_MEL.length];
    if (n) this.tone(freq(n), 0.15, "square", 0.035);
    this.step++;
  }
};

let state = "title";
let score = 0, lives = 3, roundN = 1;
let timer = 0, musicAcc = 0, invert = 0, centerText = "", subText = "";
let bullets = [], parts = [], obstacles = [], bg = [];
const keys = {};

const player = { col: COLS - 4, row: 18, bullets: 6, reload: 0, cool: 0, flash: 0 };
const enemy  = { col: 1,          row: 18, bullets: 6, reload: 0, cool: 0, flash: 0, moveDir: 1, fire: 60 };

function buildBg() {
  bg = [];
  for (let r = 0; r < ROWS; r++) {
    bg.push(new Array(COLS).fill(" "));
  }
  for (let c = 0; c < COLS; c++) bg[HORIZON][c] = "-";
  for (let r = HORIZON + 1; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = Math.random();
      if (x < 0.03) bg[r][c] = ".";
      else if (x < 0.05) bg[r][c] = ":";
    }
  }
  for (let r = 1; r < HORIZON; r++) {
    for (let c = 0; c < COLS; c++) if (Math.random() < 0.008) bg[r][c] = "*";
  }
}

function makeObstacles() {
  const o = [];
  const n = 2 + (roundN % 2);
  for (let i = 0; i < n; i++) {
    o.push({ x: Math.round(rnd(11, 26)), y: Math.round(rnd(HORIZON + 2, ROWS - 4)),
             spr: CACTUS, hp: 2, flash: 0 });
  }
  o.push({ x: Math.round(rnd(14, 21)), y: Math.round(rnd(HORIZON + 2, ROWS - 4)),
           spr: WAGON, hp: 4, flash: 0 });
  return o;
}

function newRound() {
  bullets = []; parts = [];
  player.row = Math.round(rnd(HORIZON + 2, ROWS - 4));
  enemy.row = Math.round(rnd(HORIZON + 2, ROWS - 4));
  player.bullets = 6; player.reload = 0; player.cool = 0; player.flash = 0;
  enemy.bullets = 6;  enemy.reload = 0;  enemy.cool = 0;  enemy.flash = 0;
  enemy.fire = rnd(0.5, 1.1);
  obstacles = makeObstacles();
  centerText = "DRAW!"; subText = "";
  state = "draw"; timer = 0.7;
  sfx.boot();
}

function fire(a, kind, foe) {
  if (a.cool > 0 || a.reload > 0) return;
  if (a.bullets <= 0) { a.reload = 1.4; sfx.reload(); return; }
  let dc = foe ? 1 : -1, dr = 0;
  if (kind === "up") dr = -1;
  else if (kind === "down") dr = 1;
  const len = Math.hypot(dc, dr); dc /= len; dr /= len;
  bullets.push({ c: a.col + (foe ? 3 : -1), r: a.row + 1, dc, dr, foe });
  a.bullets--; a.cool = 0.13;
  if (foe) sfx.enemyShoot(); else sfx.shoot();
}

function endRound(won) {
  if (won) { score += 10 + roundN * 5; roundN++; }
  else { lives--; }
  invert = 0.12;
  if (won) sfx.win(); else sfx.funeral();
  centerText = won ? "YOU GOT HIM!" : (lives > 0 ? "YOU BEEN HIT!" : "GAME OVER");
  subText = lives > 0 ? "PRESS SPACE" : "PRESS SPACE FOR TITLE";
  state = "msg";
}

function spark(c, r) {
  for (let i = 0; i < 5; i++) parts.push({ c, r, dc: rnd(-6, 6), dr: rnd(-6, 6), life: 0.25 });
}
function burst(c, r) {
  for (let i = 0; i < 18; i++) parts.push({ c, r, dc: rnd(-14, 14), dr: rnd(-14, 14), life: 0.6 });
}

function blockedAt(c, r) {
  for (const o of obstacles) {
    for (let yy = 0; yy < o.spr.length; yy++) {
      for (let xx = 0; xx < o.spr[yy].length; xx++) {
        if (o.spr[yy][xx] !== " " && o.x + xx === c && o.y + yy === r) return o;
      }
    }
  }
  return null;
}

function hitsActor(c, r, a) {
  const ar = Math.round(a.row);
  return c >= a.col - 1 && c <= a.col + 3 && r >= ar && r <= ar + 3;
}

function onPress(k) {
  sfx.boot();
  if (k === "m") { sfx.muted = !sfx.muted; return; }
  if (state === "title") { if (k === " ") { score = 0; lives = 3; roundN = 1; newRound(); } return; }
  if (state === "msg") { if (k === " ") { if (lives <= 0) state = "title"; else newRound(); } return; }
  if (state === "draw") return;
  if (state === "play") {
    if (k === "i") fire(player, "up", false);
    else if (k === "o") fire(player, "straight", false);
    else if (k === "p") fire(player, "down", false);
  }
}

window.addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) onPress(k);
  keys[k] = true;
  if (k === " " || "qaoipm".includes(k)) e.preventDefault();
});
window.addEventListener("keyup", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});

function update(dt) {
  if (state === "title" || state === "draw" || state === "play") {
    musicAcc += dt;
    if (musicAcc > 0.17) { musicAcc = 0; sfx.music(); }
  }
  if (invert > 0) invert -= dt;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.c += p.dc * dt; p.r += p.dr * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }

  if (state === "title" || state === "msg") return;
  if (state === "draw") { timer -= dt; if (timer <= 0) state = "play"; return; }

  if (keys["q"]) player.row -= 9 * dt;
  if (keys["a"]) player.row += 9 * dt;
  player.row = clamp(player.row, HORIZON + 1, ROWS - 3);
  if (player.cool > 0) player.cool -= dt;
  if (player.reload > 0) { player.reload -= dt; if (player.reload <= 0) { player.bullets = 6; } }

  enemy.cool -= dt;
  if (enemy.reload > 0) { enemy.reload -= dt; if (enemy.reload <= 0) enemy.bullets = 6; }
  const dyr = player.row - enemy.row;
  if (Math.abs(dyr) > 1) enemy.row += Math.sign(dyr) * 6.5 * dt;
  else { if (Math.random() < 0.02) enemy.moveDir = -enemy.moveDir; enemy.row += enemy.moveDir * 3 * dt; }
  enemy.row = clamp(enemy.row, HORIZON + 1, ROWS - 3);
  enemy.fire -= dt;
  if (enemy.fire <= 0) {
    const d = player.row - enemy.row;
    let kind = "straight";
    if (d < -1.5) kind = "up";
    else if (d > 1.5) kind = "down";
    else if (Math.random() < 0.4) kind = Math.random() < 0.5 ? "up" : "down";
    fire(enemy, kind, true);
    enemy.fire = clamp(1.3 - roundN * 0.06, 0.4, 1.3) + rnd(0, 0.9);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.c += b.dc * 26 * dt; b.r += b.dr * 26 * dt;
    const bc = Math.round(b.c), br = Math.round(b.r);
    if (b.c < 0 || b.c > COLS || b.r < HORIZON || b.r > ROWS) { bullets.splice(i, 1); continue; }
    const ob = blockedAt(bc, br);
    if (ob) {
      sfx.wall(); spark(bc, br);
      ob.hp--; ob.flash = 0.1;
      if (ob.hp <= 0) { const idx = obstacles.indexOf(ob); if (idx >= 0) obstacles.splice(idx, 1); burst(bc, br); }
      bullets.splice(i, 1); continue;
    }
    if (b.foe && hitsActor(bc, br, player)) { bullets.splice(i, 1); burst(player.col + 1, br); sfx.hit(); endRound(false); continue; }
    if (!b.foe && hitsActor(bc, br, enemy)) { bullets.splice(i, 1); burst(enemy.col + 1, br); sfx.hit(); endRound(true); continue; }
  }
}

function put(col, row, ch, shade) {
  if (ch === " " || col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  ctx.fillStyle = shade || INK;
  ctx.fillText(ch, col * CELL, row * CELL + 1);
}

function putText(col, row, str, shade) {
  for (let i = 0; i < str.length; i++) put(col + i, row, str[i], shade);
}

function drawSprite(spr, x, y, shade) {
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < spr.length; r++)
    for (let c = 0; c < spr[r].length; c++)
      put(x + c, y + r, spr[r][c], shade);
}

function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (bg[r] && bg[r][c] !== " ") put(c, r, bg[r][c], r > HORIZON ? GROUND : FAINT);

  drawSprite(SUN, 33, 1, DIM);
  drawSprite(CLOUD, 3, 1, DIM);
  drawSprite(CLOUD, 19, 3, DIM);

  for (const o of obstacles) {
    if (o.flash > 0) { o.flash -= 1 / 60; drawSprite(o.spr, o.x, o.y, INK); }
    else drawSprite(o.spr, o.x, o.y, DIM);
  }

  if (state !== "title") {
    drawSprite(COW_R, enemy.col, enemy.row, enemy.flash > 0 ? INK : DIM);
    drawSprite(COW_L, player.col, player.row, INK);
  }

  for (const b of bullets) {
    let ch = "-";
    if (b.dr < 0) ch = "/"; else if (b.dr > 0) ch = "\\";
    put(Math.round(b.c), Math.round(b.r), ch, INK);
  }
  for (const p of parts) put(Math.round(p.c), Math.round(p.r), "*", DIM);

  if (state !== "title") {
    putText(1, 0, "SCORE " + String(score).padStart(4, "0"));
    putText(18, 0, "ROUND " + roundN);
    putText(COLS - 12, 0, "LIVES ");
    for (let i = 0; i < lives; i++) put(COLS - 6 + i, 0, "@");
    let ammo = "AMMO ";
    for (let i = 0; i < 6; i++) ammo += i < player.bullets ? "#" : ".";
    putText(1, ROWS - 1, ammo, player.reload > 0 ? FAINT : DIM);
    if (player.reload > 0) putText(12, ROWS - 1, "RELOADING...", FAINT);
  }

  if (state === "title") {
    putText(10, 6, "B O O T   S W I L L", INK);
    putText(10, 7, "===================", DIM);
    putText(8, 11, "A GUNFIGHT IN TEXT MODE", DIM);
    putText(13, 15, "Q up   A down", DIM);
    putText(2, 16, "I fire up   O fire side   P fire down", DIM);
    putText(3, 17, "6 bullets a round. Use the cover.", DIM);
    putText(10, 20, "PRESS SPACE TO DRAW", INK);
  }

  if (state === "draw" || state === "msg") {
    const cx = Math.max(0, Math.floor((COLS - centerText.length) / 2));
    putText(cx, 11, centerText, INK);
    if (subText) putText(Math.max(0, Math.floor((COLS - subText.length) / 2)), 13, subText, DIM);
  }

  if (invert > 0) {
    ctx.globalCompositeOperation = "difference";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  }
}

let last = 0;
function loop(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

buildBg();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
